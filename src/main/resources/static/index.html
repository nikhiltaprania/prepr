<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Prepr — AI Interview Coaching</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235B5BD6'/%3E%3C/svg%3E"/>
    <!-- AG Grid Community (CDN) for data-dense tables. `async` so a slow/unreachable CDN never blocks
         app boot; the UI shows a simple table immediately and upgrades to the grid when ready. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css"/>
    <script async src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body data-layout="app">
    <!-- The shell (sidebar + topbar + #outlet) is rendered once by ui/shell.js.
         Only #outlet swaps per route; layout chrome is toggled via body[data-layout]. -->
    <div id="app"></div>

    <!-- Singleton overlay root, mounted once. -->
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>

    <!-- Visually-hidden live region for screen-reader announcements (e.g. AI replies). -->
    <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
